# Running via docker compose → the container gets vars from .env.docker + overrides from the environment: block.
# Your local .env file (if it exists) is not injected into the container — it's only used for ${VAR} interpolation in docker-compose.yml.
# A local .env does not get overwritten by .env.docker or vice versa — they serve different purposes.

version: "3.9"

services:
  stock_app:
    # Use builder stage so dev dependencies (ts-node/nodemon) are available
    build:
      context: .
      target: builder
    container_name: stocks-executor-app
    env_file:
      - .env
    environment:
      PG_HOST: stock_postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-stocks_executor_dev}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      REDIS_HOST: stock_redis
      REDIS_PORT: 6379
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-dev-master-key-32-chars-minimum!!}
      POLLING_INTERVAL_MS: ${POLLING_INTERVAL_MS:-15000}
      DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@stock_postgres:5432/${PG_DATABASE:-stocks_executor_dev}
      # Mock server integration (comment out for production)
      DHAN_API_BASE_URL: http://stock_mock:4000
      DHAN_AUTH_BASE_URL: http://stock_mock:4000
      ACTIVE_TRADES_URL: http://stock_mock:4000/api/active-trades
      CLOSED_TRADES_URL: http://stock_mock:4000/api/closed-trades
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-lc", "[ -d node_modules ] || npm ci; npm run migrate:up && npm run dev:watch"]
    depends_on:
      stock_postgres:
        condition: service_healthy
      stock_redis:
        condition: service_healthy
      stock_mock:
        condition: service_healthy

  # Worker: BullMQ job processor (dev mode — single replica with hot-reload)
  stock_worker:
    build:
      context: .
      target: builder
    container_name: stocks-executor-worker
    env_file:
      - .env
    environment:
      PG_HOST: stock_postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-stocks_executor_dev}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      REDIS_HOST: stock_redis
      REDIS_PORT: 6379
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-dev-master-key-32-chars-minimum!!}
      # Mock server integration (comment out for production)
      DHAN_API_BASE_URL: http://stock_mock:4000
      DHAN_AUTH_BASE_URL: http://stock_mock:4000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      [
        "sh",
        "-lc",
        "[ -d node_modules ] || npm ci; npx nodemon --exec 'npx ts-node src/workerMain.ts' --ext ts --watch src",
      ]
    depends_on:
      stock_postgres:
        condition: service_healthy
      stock_redis:
        condition: service_healthy
    restart: unless-stopped

  stock_postgres:
    image: postgres:16-alpine
    container_name: stocks-executor-postgres
    environment:
      POSTGRES_DB: ${PG_DATABASE:-stocks_executor_dev}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-7432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  stock_redis:
    image: redis:7-alpine
    container_name: stocks-executor-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # Mock Server: Simulates Dhan API + Signal APIs for local development
  stock_mock:
    build:
      context: ./mock-server
    container_name: stocks-executor-mock
    environment:
      MOCK_MODE: ${MOCK_MODE:-allSuccess}
      MOCK_PORT: 4000
      FAILURE_RATE: ${FAILURE_RATE:-0.5}
      MAX_LATENCY_MS: ${MAX_LATENCY_MS:-500}
    ports:
      - "${MOCK_PORT:-4000}:4000"
    volumes:
      - ./mock-server:/app
      - mock_node_modules:/app/node_modules
    command: ["sh", "-lc", "[ -d node_modules ] || npm install; npm run dev"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  node_modules:
  redis-data:
  mock_node_modules:
